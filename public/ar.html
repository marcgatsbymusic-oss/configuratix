<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mammut AR Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,10,11,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: env(safe-area-inset-top, 0) 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(56px + env(safe-area-inset-top, 0));
    }

    #header h1 {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #eab676;
    }

    #close-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    #engine-wrapper {
      position: fixed;
      inset: 0;
      top: calc(56px + env(safe-area-inset-top, 0));
    }

    needle-engine {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Style the Needle Engine XR button that appears automatically */
    #NeedleXRButton, .needle-xr-button, [data-needle-xr-button] {
      position: fixed !important;
      bottom: 40px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      background: #eab676 !important;
      color: #000 !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 18px 40px !important;
      font-size: 13px !important;
      font-weight: 900 !important;
      letter-spacing: 0.15em !important;
      text-transform: uppercase !important;
      cursor: pointer !important;
      z-index: 50 !important;
      box-shadow: 0 0 30px rgba(234,182,118,0.4) !important;
      white-space: nowrap !important;
    }

    #hint {
      position: fixed;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>AR Preview</h1>
    <a id="close-btn" href="javascript:history.back()">← Back</a>
  </div>

  <div id="engine-wrapper">
    <needle-engine
      id="needle"
      src="/models/window-scene.glb"
      camera-position="0 0.9 2.5"
      camera-target="0 0.6 0"
      background-color="#0a0a0b"
    ></needle-engine>
  </div>

  <p id="hint">Tap "Enter AR" to place the window in your space</p>

  <script type="module">
    // Import Needle Engine from the installed npm package.
    // The Vite dev server / Vercel build resolves this correctly.
    import '@needle-tools/engine';

    // Once Needle Engine is loaded and the scene is ready, add the WebXR component
    // programmatically so the AR button appears automatically.
    const engine = document.getElementById('needle');

    engine.addEventListener('loadstart', () => {
      console.log('[Mammut AR] Needle Engine loading…');
    });

    engine.addEventListener('ready', async (e) => {
      console.log('[Mammut AR] Needle Engine ready, injecting WebXR component');
      try {
        const { WebXR, Context } = await import('@needle-tools/engine');
        const ctx = e.detail?.context || Context.Current;
        if (ctx && ctx.scene) {
          const xr = ctx.scene.addComponent(WebXR);
          if (xr) {
            xr.createARButton = true;
            xr.createVRButton = false;
            console.log('[Mammut AR] WebXR component added, AR button should appear');
          }
        }
      } catch (err) {
        console.warn('[Mammut AR] Could not inject WebXR component:', err);
        // Fallback: the needle-engine web component may already expose an AR button
        // via its built-in UI when WebXR is detected.
      }
    });
  </script>
</body>
</html>
